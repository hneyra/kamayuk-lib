# Las librerias comunes: lint, tipos y pruebas.
#
# NO NECESITA NINGUN CLON HERMANO, y conviene decirlo porque es al reves que en todos los demas
# repositorios del producto: aqui no hay `includeBuild` ni `link:` que resolver contra el disco.
# `kamayuk-lib` es el extremo del grafo — lo consumen los cinco sistemas y el no consume a nadie—,
# asi que se clona donde toca y ya.
#
# Lo que si cambia por existir este repositorio es el CI de los CUATRO frontends: pasan de cero
# clones hermanos a uno, y su anfitrion tiene que bajar a un `path:` para que el hermano quepa al
# lado. Eso se toca en cada sistema, no aqui.

name: Paquetes

# `CLAUDE.md` y `README.md` estan aqui desde #128, y no por ser documentacion: `yarn verificar`
# corre `yarn cifras --comprobar`, que LEE esos dos archivos y sale en rojo si una cifra de pruebas
# escrita no es la medida. Sin ellos en la lista, un PR que solo tocara una cifra a mano no dispararia
# la comprobacion que existe para cazarlo. Lo vigila `las-cifras-las-escribe-un-guion.test.ts`,
# que lee la lista de archivos de `cifras.mjs` y no una copia.
#
# Y `.gitattributes`, por lo mismo: `el-registro-se-mezcla-solo.test.ts` monta la mezcla del
# registro con ESE archivo y exige que salga limpia. Un PR que solo borrara la linea de
# `merge=union` no dispararia, sin esto, la prueba que existe para pararlo. Y `**/.gitattributes`
# tambien: uno ANIDADO —`docs/agent/.gitattributes` con `HISTORY.md -merge`— anula el de la raiz
# sin tocarlo, y `docs/**` no esta en la lista (medido en la segunda revision de #128).
on:
  push:
    branches: [main]
    paths:
      - "paquetes/**"
      - "*.json"
      - "*.ts"
      - "eslint.config.js"
      - ".github/workflows/paquetes.yml"
      - "CLAUDE.md"
      - "README.md"
      - ".gitattributes"
      - "**/.gitattributes"
  pull_request:
    paths:
      - "paquetes/**"
      - "*.json"
      - "*.ts"
      - "eslint.config.js"
      - ".github/workflows/paquetes.yml"
      - "CLAUDE.md"
      - "README.md"
      - ".gitattributes"
      - "**/.gitattributes"

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      consumidores: ${{ steps.quien.outputs.consumidores }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      # `--frozen-lockfile`: si el `yarn.lock` no cuadra con los `package.json`, se para aqui en
      # vez de resolver otra cosa en silencio y probar un arbol que nadie tiene en su maquina.
      - name: Instalar
        run: yarn install --frozen-lockfile

      - name: Verificar
        run: yarn verificar

      # EL ENSAYO DE LA RESOLUCION DE LA RAMA DEL CONSUMIDOR (#26, AC3).
      #
      # Las muestras del parser corren en `yarn verificar` y NO tocan la red, que es como tiene que
      # ser. Pero «la rama nombrada que no existe sale roja» no se puede demostrar sin preguntarle a
      # un repositorio de verdad, y por eso hay un paso aparte: ejercita el guion entero —proceso,
      # codigo de salida y palabras— contra ESTE repositorio usado como consumidor de banco, con una
      # rama que existe y otra que no. Una costumbre no es una guarda (#19).
      - name: El ensayo de la resolucion, contra un remoto de verdad
        env:
          KAMAYUK_TOKEN_DE_CLON: ${{ secrets.GH_CLONE_KEY || github.token }}
        run: node paquetes/verificaciones/ensayar-la-rama-del-consumidor.mjs

      # La lista de consumidores sale del JSON y no de este archivo: anadir un sistema tiene que
      # ser una linea de datos. `jq -c` la deja en una sola linea, que es lo que `fromJSON` pide.
      - name: Quien consume esta libreria
        id: quien
        run: echo "consumidores=$(jq -c '.consumidores' consumidores.json)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------
  # LA CI MIRA A SUS CONSUMIDORES (#10)
  #
  # Con `link:` no hay `npm publish` que actue de compuerta, ni rango semver que de margen, ni
  # lockfile del consumidor que fije nada: **cada `main` de aqui es, sin intermediario, el `main` de
  # los sistemas**. Lo que esta CI verificaba hasta hoy es que la libreria es coherente CONSIGO
  # MISMA; su contrato no es ese, es lo que los consumidores leen de ella.
  #
  # Y no es teorico. Paso dos veces:
  #   · #8 renombro `--radius-radio` a `--radius`: 217 pruebas en verde aqui, `rentas` en rojo con
  #     «expected 44 to be 42». Se cazo corriendo la suite del consumidor A MANO.
  #   · #14 anadio `cmdk` y `sonner` como `peerDependencies`: verde aqui, y `rentas` con tres
  #     archivos sin recoger. Esa vez lo dijo antes una guarda DEL CONSUMIDOR, no esta CI.
  #
  # ## POR QUE SE MIDE DOS VECES, Y NO UNA
  #
  # Correr la suite del consumidor contra esta rama y fallar si sale roja tiene un modo de fallo
  # obvio: **el consumidor puede estar roto por su cuenta**, y entonces esta CI se pone roja por un
  # motivo ajeno. Un guardian que da falsos positivos se acaba ignorando, y con el se ignora el
  # positivo de verdad.
  #
  # Asi que se corre DOS veces con el mismo arbol del consumidor: una con la libreria en `main` —la
  # linea base— y otra con la libreria en esta rama. Lo que falla el trabajo no es «el consumidor
  # esta rojo» sino **«esta rama lo puso rojo»**: base verde y rama roja. Si las dos salen rojas, se
  # dice con todas las letras y se sigue, porque el problema no es de aqui.
  #
  # ## Y CONTRA QUE RAMA DEL CONSUMIDOR (#26)
  #
  # Hasta #26 se clonaba la rama por omision del consumidor, y con eso un cambio de esta libreria
  # que exija un ajuste alla **no podia salir verde nunca**: el PR de aqui media contra un consumidor
  # sin el ajuste y el PR de alla contra una libreria sin el cambio. Ahora un PR puede NOMBRAR la
  # rama del consumidor en una linea de su cuerpo —`consumidor: <duenno>/<sistema>@<rama>`— y se mide
  # contra ella. La decision de que fuera una linea del cuerpo, y no un archivo ni una etiqueta, esta
  # medida y escrita en `paquetes/verificaciones/rama-del-consumidor.mjs`; en dos palabras: es la
  # unica de las tres que **desaparece al mezclar**, porque el cuerpo del PR no es parte del arbol.
  #
  # LA LOGICA NO ESTA EN ESTE ARCHIVO A PROPOSITO. Un `run:` de quince lineas no se puede probar, y
  # asi es como se llego al hueco que #26 cierra. El parser del cuerpo y la resolucion por consumidor
  # son un guion con sus muestras (`la-rama-del-consumidor.test.ts`), y aqui solo se le llama.
  #
  # ## QUE SIGNIFICA LA LINEA BASE CUANDO SI HAY RAMA NOMBRADA
  #
  # Deja de separar «el consumidor estaba roto» de «esta rama lo rompio», y el veredicto tiene que
  # decir la verdad en los dos caminos. La rama nombrada trae el ajuste que ESPERA el cambio de aqui,
  # asi que **contra la libreria en `main` puede estar legitimamente roja** — y con el criterio de
  # #10 («si las dos salen rojas, no es de aqui») ese caso saldria en verde sin haber comprobado
  # nada. Cuando el PR nombra una rama, el contrato es el PAR, y el par se mide una sola vez: con
  # esta rama. Si sale roja, bloquea.
  # ---------------------------------------------------------------------------------------
  consumidores:
    name: ${{ matrix.repositorio }} sigue en verde con esta rama
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # La lista vive en `consumidores.json` y no aqui: anadir un sistema tiene que ser una linea
        # de datos, no un `job` copiado. `fromJSON` la lee tal cual.
        include: ${{ fromJSON(needs.verificar.outputs.consumidores) }}
    steps:
      - name: Esta libreria
        uses: actions/checkout@v7
        with:
          path: kamayuk-lib
          # Historia completa: hay que poder saltar entre `main` y esta rama en el mismo arbol.
          fetch-depth: 0

      # Node hace falta ANTES de clonar al consumidor, porque lo que decide contra que rama clonarlo
      # es un guion de esta libreria. La version no se deja a la que traiga la imagen del corredor:
      # este repositorio declara `node >=24`. El `setup-node` de mas abajo se queda donde esta,
      # porque el suyo cachea el `yarn.lock` DEL CONSUMIDOR y ese archivo todavia no existe aqui.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # CONTRA QUE RAMA DEL CONSUMIDOR SE MIDE ESTE PR (#26).
      #
      # El cuerpo del PR entra por `env:` y no interpolado en el `run:`, que es como lo pasa
      # `registro.yml` desde #4: un cuerpo lo escribe un humano y dentro puede ir cualquier cosa.
      # Sale `rama=` (vacia = la rama por omision del consumidor) y `nombrada=`.
      #
      # `--comprobar` es el AC3: la rama nombrada se le pregunta al repositorio con
      # `git ls-remote --exit-code --heads` ANTES de clonar, y si no esta, este paso rompe el trabajo
      # diciendo cual era y de quien. Sin esto, el rojo lo daria `actions/checkout` en el paso
      # siguiente, con otras palabras y sin decir que el PR nombro una rama que no existe.
      - name: Contra que rama del consumidor se mide este PR
        id: contra
        working-directory: kamayuk-lib
        env:
          KAMAYUK_CUERPO_DEL_PR: ${{ github.event.pull_request.body }}
          KAMAYUK_TOKEN_DE_CLON: ${{ secrets.GH_CLONE_KEY || github.token }}
          QUIEN: ${{ matrix.repositorio }}
        run: >-
          node paquetes/verificaciones/rama-del-consumidor.mjs
          --consumidor "$QUIEN" --comprobar >> "$GITHUB_OUTPUT"

      - name: El consumidor
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repositorio }}
          # Vacio es «la rama por omision del repositorio», que es lo que hacia hasta #26 y sigue
          # siendo el caso normal (AC2). NO se pone `main` de reserva: la rama por omision de un
          # consumidor la decide el consumidor, y escribirla aqui seria suponerla.
          ref: ${{ steps.contra.outputs.rama }}
          # DIRECTAMENTE EN SU SITIO, Y NO EN `consumidor/` PARA MOVERLO DESPUES (#93).
          #
          # La disposicion que el `link:` del consumidor espera es `<x>/<sistema>/frontend` junto a
          # `<x>/kamayuk-lib`: `link:../../kamayuk-lib/...` sube dos niveles desde `frontend/` y
          # tiene que caer al lado de la libreria. Eso no cambia — lo que cambia es que el clon cae
          # ahi de una vez, sin el `mv consumidor '<directorio>'` que habia hasta #93.
          #
          # Y NO ES COSMETICA: `actions/checkout@v7` guarda las credenciales del clon en un archivo
          # APARTE, enganchado con `includeIf.gitdir:<ruta absoluta del clon>/.git`, en vez de
          # dejarlas en el `.git/config` como hacia `@v4`. Un `includeIf` por ruta absoluta **no
          # sobrevive a mover el directorio**: tras el `mv`, la condicion deja de casar, el clon se
          # queda sin autenticacion y el `git fetch` de un `orden` revienta con
          # `fatal: could not read Username for 'https://github.com'` y RC=128. Medido en el trabajo
          # de `catastro`, cuyo `orden` baja un commit antes de verificar; los cinco consumidores
          # que no tocan la red no se enteraban, que es lo que lo hacia un defecto silencioso.
          path: ${{ matrix.directorio }}
          token: ${{ secrets.GH_CLONE_KEY || github.token }}

      # `check-latest: true` es lo que hace que «24» sea la ULTIMA 24 y no la que el corredor tenga
      # en su cache. Sin ello, el 2026-09-23 `rentas` subio su `engines` a `^24.21.0` y este trabajo
      # salio rojo ANTES de medir nada —en la linea base y en la rama por igual—, con
      # `The engine "node" is incompatible with this module. Expected version "^24.21.0". Got
      # "24.20.0"` al instalar: el corredor traia la 24.20.0 en su cache y `setup-node` no mira mas
      # alla si no se le pide. Lo que el consumidor exige lo decide el consumidor; esta CI solo
      # tiene que no quedarse atras. Lo vigila `los-consumidores-se-miran.test.ts`.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: yarn
          cache-dependency-path: ${{ format('{0}/{1}/yarn.lock', matrix.directorio, matrix.ruta) }}

      - name: Instalar las dependencias del consumidor
        working-directory: ${{ format('{0}/{1}', matrix.directorio, matrix.ruta) }}
        run: yarn install --frozen-lockfile

      # LA LINEA BASE. Sin ella, un consumidor roto por su cuenta pondria este trabajo en rojo por
      # un motivo que no es de esta rama.
      - name: Linea base — el consumidor con la libreria en `main`
        id: base
        working-directory: ${{ format('{0}/{1}', matrix.directorio, matrix.ruta) }}
        continue-on-error: true
        run: |
          git -C "$GITHUB_WORKSPACE/kamayuk-lib" checkout --quiet --detach origin/main
          echo "La libreria esta en: $(git -C "$GITHUB_WORKSPACE/kamayuk-lib" rev-parse --short HEAD)"
          ${{ matrix.orden }}

      - name: Con esta rama
        id: rama
        working-directory: ${{ format('{0}/{1}', matrix.directorio, matrix.ruta) }}
        continue-on-error: true
        run: |
          git -C "$GITHUB_WORKSPACE/kamayuk-lib" checkout --quiet --detach "$GITHUB_SHA"
          echo "La libreria esta en: $(git -C "$GITHUB_WORKSPACE/kamayuk-lib" rev-parse --short HEAD)"
          ${{ matrix.orden }}

      # El veredicto va en un paso aparte porque los dos de arriba llevan `continue-on-error`: sin
      # esto, el trabajo saldria VERDE con los dos en rojo.
      - name: El veredicto
        env:
          BASE: ${{ steps.base.outcome }}
          RAMA: ${{ steps.rama.outcome }}
          QUIEN: ${{ matrix.repositorio }}
          RAMA_DEL_CONSUMIDOR: ${{ steps.contra.outputs.rama }}
        run: |
          echo "el consumidor se midio en:     ${RAMA_DEL_CONSUMIDOR:-su rama por omision}"
          echo "linea base (libreria en main): $BASE"
          echo "con esta rama:                 $RAMA"

          # CAMINO CON RAMA NOMBRADA (#26). La linea base ya no separa «estaba roto» de «esta rama
          # lo rompio»: la rama nombrada trae el ajuste que ESPERA este cambio, asi que contra la
          # libreria en «main» puede estar legitimamente roja. El contrato es el PAR, y el par se
          # mide una sola vez — con esta rama—, asi que aqui el rojo bloquea siempre.
          if [ -n "$RAMA_DEL_CONSUMIDOR" ]; then
            if [ "$RAMA" = "success" ]; then
              echo "«$QUIEN@$RAMA_DEL_CONSUMIDOR» sale en verde con esta rama: el par cierra."
              if [ "$BASE" != "success" ]; then
                echo "::notice::La linea base salio ROJA, y aqui eso se ESPERA: «$RAMA_DEL_CONSUMIDOR» trae el ajuste que este cambio necesita, asi que contra la libreria en «main» tenia que fallar. No es un aviso de nada."
              fi
              echo ""
              echo "Las dos mitades se mezclan JUNTAS, y esta CI no lo hace por nadie: lo unico que"
              echo "dice es que el par cierra. Mezclar primero la del consumidor deja su «main» roto"
              echo "hasta que se mezcle esta."
              exit 0
            fi
            echo "::error::ESTA RAMA NO CIERRA CON «$QUIEN@$RAMA_DEL_CONSUMIDOR»."
            echo "El PR nombra esa rama del consumidor como la que trae el ajuste que su cambio"
            echo "necesita, y con las dos puestas la suite sale en ROJO: el par no cierra."
            echo ""
            echo "Y este trabajo bloquea aunque la linea base tambien este roja. Cuando un PR nombra"
            echo "una rama, LA RAMA NOMBRADA ES EL CONTRATO: «las dos rojas, no es de aqui» valia"
            echo "cuando las dos median lo mismo, y aqui la rama nombrada esta puesta justo para que"
            echo "no lo hagan."
            exit 1
          fi

          # CAMINO DE SIEMPRE (#10), que no cambia: sin rama nombrada se mide la de por omision.
          if [ "$RAMA" = "success" ]; then
            echo "«$QUIEN» sigue en verde con esta rama."
            exit 0
          fi
          if [ "$BASE" != "success" ]; then
            echo "::warning::«$QUIEN» ya estaba rojo con la libreria en «main». Esta rama NO es la causa,"
            echo "::warning::asi que este trabajo no la bloquea. Pero alguien tiene que mirarlo alli."
            echo ""
            echo "Y si ese rojo ES el ajuste que esta rama necesita, el PR lo puede decir con una"
            echo "linea en su cuerpo —«consumidor: <duenno>/<sistema>@<rama>»— y entonces se mide"
            echo "contra esa rama en vez de contra la de por omision (#26)."
            exit 0
          fi
          echo "::error::ESTA RAMA ROMPE A «$QUIEN»."
          echo "Con la libreria en «main» su suite sale en VERDE; con esta rama, en ROJO."
          echo "El registro del paso «Con esta rama» dice que fallo."
          echo ""
          echo "Es lo que kamayuk-lib#10 existe para cazar: con «link:» no hay version que de"
          echo "margen — lo que se mezcle aqui es lo que ese sistema tiene en el siguiente «git pull»."
          echo ""
          echo "Si el arreglo esta en una rama del consumidor, nombrala en el cuerpo del PR"
          echo "—«consumidor: <duenno>/<sistema>@<rama>»— y esta CI medira contra ella (#26)."
          exit 1
